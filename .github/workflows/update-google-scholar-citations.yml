name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Scholar citation count and update README
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          # Use Zhijun Chen's Google Scholar *author profile* entry for this survey.
          # That page shows the *merged cluster* citation total (~174), which folds
          # together arXiv:2502.18036 (~139) and Scholar's other version records.
          # Organic google_scholar search only returns per-version counts; preferring
          # the arXiv id therefore under-counts vs the profile.
          AUTHOR_ID = "3slpkWAAAAAJ"
          # Stable citation_for_view id for this paper on the author profile.
          CITATION_ID = "3slpkWAAAAAJ:_kc_bZDykSQC"
          TITLE = "Harnessing Multiple Large Language Models: A Survey on LLM Ensemble"
          TITLE_NEEDLES = (
              "harnessing multiple large language models",
              "llm ensemble",
          )
          ARXIV_ID = "2502.18036"

          scholar_url = (
              "https://scholar.google.com/citations?"
              + urllib.parse.urlencode({
                  "view_op": "view_citation",
                  "hl": "en",
                  "user": AUTHOR_ID,
                  "citation_for_view": CITATION_ID,
              })
          )

          api_key = os.environ.get("SERPAPI_KEY", "").strip()
          if not api_key:
              raise RuntimeError(
                  "SERPAPI_KEY secret is missing or empty. "
                  "Add it under Settings > Secrets and variables > Actions."
              )

          def serpapi_get(params):
              qs = urllib.parse.urlencode({**params, "api_key": api_key})
              url = "https://serpapi.com/search.json?" + qs
              try:
                  with urllib.request.urlopen(url) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"SerpAPI HTTP {e.code}: {body}") from e

          def title_matches(title: str) -> bool:
              t = (title or "").lower()
              return all(n in t for n in TITLE_NEEDLES)

          # 1) Preferred: author-profile article list (merged cluster cites).
          author_data = serpapi_get({
              "engine": "google_scholar_author",
              "author_id": AUTHOR_ID,
              "hl": "en",
              "num": "100",
          })
          articles = author_data.get("articles") or []

          profile_hits = []
          for art in articles:
              title = art.get("title") or ""
              if not title_matches(title):
                  continue
              cited = art.get("cited_by") or {}
              value = cited.get("value")
              if value is None:
                  continue
              profile_hits.append(art)

          target_source = None
          count = None
          cluster_or_cites_id = None

          if profile_hits:
              # If several title matches exist, take the highest merged count.
              target = max(
                  profile_hits,
                  key=lambda a: int((a.get("cited_by") or {}).get("value") or 0),
              )
              count = int((target.get("cited_by") or {}).get("value"))
              target_source = "author_profile"
              if target.get("link"):
                  scholar_url = target["link"]
              citation_id = target.get("citation_id") or CITATION_ID
              cited = target.get("cited_by") or {}
              cluster_or_cites_id = cited.get("cites_id") or citation_id
              print(
                  "Selected author-profile record:",
                  json.dumps(
                      {
                          "title": target.get("title"),
                          "publication": target.get("publication"),
                          "citations": count,
                          "citation_id": citation_id,
                          "link": target.get("link"),
                          "cites_id": cited.get("cites_id"),
                          "profile_hits": [
                              {
                                  "title": a.get("title"),
                                  "publication": a.get("publication"),
                                  "citations": (a.get("cited_by") or {}).get("value"),
                                  "citation_id": a.get("citation_id"),
                              }
                              for a in profile_hits
                          ],
                      },
                      indent=2,
                      ensure_ascii=False,
                  ),
              )
          else:
              # 2) Fallback: organic Scholar search — prefer highest cites among
              # title matches (do NOT prefer arXiv-only ~139 over a larger cluster).
              print(
                  "Author-profile match missing; falling back to organic Scholar search."
              )
              search_data = serpapi_get({
                  "engine": "google_scholar",
                  "q": f'"{TITLE}"',
                  "hl": "en",
                  "num": "20",
              })
              results = search_data.get("organic_results") or []
              if not results:
                  raise RuntimeError("No Google Scholar results found.")

              def citation_count(item):
                  cited_by = item.get("inline_links", {}).get("cited_by", {}) or {}
                  total = cited_by.get("total")
                  return int(total) if total is not None else None

              def text_blob(item):
                  pub = item.get("publication_info", {}) or {}
                  parts = [
                      item.get("title", ""),
                      item.get("link", ""),
                      item.get("snippet", ""),
                      pub.get("summary", ""),
                  ]
                  return " ".join(p for p in parts if p).lower()

              def is_our_paper(item):
                  blob = text_blob(item)
                  title = item.get("title", "").lower()
                  if ARXIV_ID in blob:
                      return True
                  return all(n in title for n in TITLE_NEEDLES) or all(
                      n in blob for n in TITLE_NEEDLES
                  )

              candidates = [
                  item
                  for item in results
                  if citation_count(item) is not None and is_our_paper(item)
              ]
              if not candidates:
                  for item in results:
                      if citation_count(item) is not None:
                          candidates.append(item)
              if not candidates:
                  print(json.dumps(results[:5], indent=2, ensure_ascii=False))
                  raise RuntimeError("No citation count found in Google Scholar result.")

              # Prefer the *largest* Scholar-reported count (merged/cluster if present).
              target = max(candidates, key=lambda item: citation_count(item) or 0)
              count = citation_count(target)
              target_source = "organic_search_max"
              inline = target.get("inline_links", {}) or {}
              versions = inline.get("versions", {}) or {}
              cited_by = inline.get("cited_by", {}) or {}
              cluster_or_cites_id = versions.get("cluster_id") or cited_by.get("cites_id")
              if cluster_or_cites_id:
                  scholar_url = (
                      f"https://scholar.google.com/scholar?"
                      f"cluster={cluster_or_cites_id}&hl=en"
                  )
              elif cited_by.get("link"):
                  scholar_url = cited_by["link"]
              elif target.get("link"):
                  scholar_url = target["link"]

              print(
                  "Selected organic Scholar record:",
                  json.dumps(
                      {
                          "title": target.get("title"),
                          "link": target.get("link"),
                          "publication": (target.get("publication_info") or {}).get(
                              "summary"
                          ),
                          "citations": count,
                          "cluster_id": cluster_or_cites_id,
                          "candidates": [
                              {
                                  "title": c.get("title"),
                                  "publication": (c.get("publication_info") or {}).get(
                                      "summary"
                                  ),
                                  "citations": citation_count(c),
                                  "link": c.get("link"),
                              }
                              for c in sorted(
                                  candidates,
                                  key=lambda item: citation_count(item) or 0,
                                  reverse=True,
                              )
                          ],
                      },
                      indent=2,
                      ensure_ascii=False,
                  ),
              )

          if count is None:
              raise RuntimeError("No citation count found.")

          count_str = str(count)

          badge = f'''<!-- GS_CITATIONS_BADGE_START -->
          <a href="{scholar_url}">
            <img src="https://img.shields.io/badge/Google%20Scholar%20Citations-{count_str}-brightgreen?labelColor=555555" alt="Google Scholar citations">
          </a>
          <!-- GS_CITATIONS_BADGE_END -->'''

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- GS_CITATIONS_BADGE_START -->.*?<!-- GS_CITATIONS_BADGE_END -->"

          if not re.search(pattern, readme, flags=re.S):
              raise RuntimeError("Citation badge markers not found in README.md.")

          readme = re.sub(pattern, badge, readme, flags=re.S)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)

          print(
              f"Updated Google Scholar citations to {count_str} "
              f"(source={target_source}, id={cluster_or_cites_id})"
          )
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update Google Scholar citation badge"
          git push
